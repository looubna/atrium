name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.9"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked
      - name: Lint
        run: uv run ruff check app tests
      - name: Type check
        run: uv run mypy app
      - name: Unit tests
        run: uv run pytest -q tests/unit
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: firebase/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Firebase CLI
        working-directory: firebase
        run: npm ci
      - name: Integration tests (Firestore emulator)
        run: >-
          ../firebase/node_modules/.bin/firebase emulators:exec
          --config ../firebase/firebase.json --project demo-atrium --only firestore
          "uv run pytest -q tests/integration"

  security-rules:
    name: Firestore and Storage rules
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firebase
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: firebase/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - run: npm run test:emulators

  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.8"
      - run: terraform fmt -check -recursive infra/terraform
      - name: Validate environments
        run: |
          for env in infra/terraform/envs/*/; do
            terraform -chdir="$env" init -backend=false -input=false
            terraform -chdir="$env" validate
          done

  container:
    name: Backend image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build
        run: docker build --tag atrium-backend:ci backend
