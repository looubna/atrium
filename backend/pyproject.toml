[project]
name = "atrium-backend"
version = "0.1.0"
description = "Atrium coaching platform API and worker"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.120",
  "uvicorn[standard]>=0.35",
  "pydantic>=2.11",
  "pydantic-settings>=2.10",
  "python-multipart>=0.0.20",
  "httpx>=0.28",
  "google-adk[otel-gcp]>=2.9,<3",
  "google-genai>=2.23,<3",
  "firebase-admin>=7.5,<8",
  "google-cloud-firestore>=2.30,<3",
  "google-cloud-storage>=3.14,<4",
  "google-cloud-speech>=2.40,<3",
  "google-cloud-tasks>=2.24,<3",
  "google-auth>=2.40",
  "opentelemetry-sdk>=1.36",
  "opentelemetry-instrumentation-fastapi>=0.57b0",
  "opentelemetry-exporter-otlp-proto-grpc>=1.36",
  "pypdf>=6.0",
  "python-docx>=1.2",
  "numpy>=2.2",
  "google-cloud-texttospeech>=2.29",
]

[dependency-groups]
dev = [
  "pytest>=8.4",
  "pytest-asyncio>=1.1",
  "ruff>=0.12",
  "mypy>=1.17",
  "pytest-timeout>=2.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "emulator: requires Firebase emulators (Firestore/Auth/Storage)",
  "live_ai: calls real Vertex AI models; run manually in dev only",
]
addopts = "-m 'not live_ai'"
# A hung test fails with a stack dump instead of stalling CI.
timeout = 120

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
