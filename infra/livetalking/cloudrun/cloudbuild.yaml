# gcloud builds submit --config infra/livetalking/cloudrun/cloudbuild.yaml infra/livetalking --project atrium-coach-app
steps:
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        gcloud storage cp gs://atrium-coach-app-livetalking/cloudrun/mt.tar gs://atrium-coach-app-livetalking/cloudrun/livetalking.tar cloudrun/
        cp atrium.py cloudrun/atrium.py
  - name: gcr.io/cloud-builders/docker
    args: [build, -t, us-east4-docker.pkg.dev/atrium-coach-app/atrium/atrium-face:$BUILD_ID, -t, us-east4-docker.pkg.dev/atrium-coach-app/atrium/atrium-face:latest, cloudrun]
images:
  - us-east4-docker.pkg.dev/atrium-coach-app/atrium/atrium-face:$BUILD_ID
  - us-east4-docker.pkg.dev/atrium-coach-app/atrium/atrium-face:latest
options:
  machineType: E2_HIGHCPU_8
  diskSizeGb: 400
timeout: 5400s
